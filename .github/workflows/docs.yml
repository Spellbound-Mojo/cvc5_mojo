name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: docs
          locked: true
      # Runs the documentation audit, builds the site in strict mode into
      # .cache/docs-site, then audits its links, anchors and search index.
      # The API reference comes from the committed api/cvc5-api.json, so no
      # Mojo toolchain or cvc5 download is needed.
      - run: pixi run -e docs python -m unittest discover -s tests -p 'test_*.py'
      - run: pixi run -e docs docs-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix docs/qa --ignore-scripts --no-audit --no-fund
      - run: pixi run -e docs python scripts/vendor_docs_math.py --check
      - run: docs/qa/node_modules/.bin/playwright install --with-deps chromium
      - run: node docs/qa/check.mjs
      # Publishing is a public act: deploy only from main of a public
      # repository. While the repository is private the site is checked, not
      # published.
      - if: github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .cache/docs-site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
